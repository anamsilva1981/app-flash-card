name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      APP_OWNER_NAME: ${{ vars.APP_OWNER_NAME }}
      APP_SUPPORT_URL: ${{ vars.APP_SUPPORT_URL }}
      APP_PRIVACY_UPDATED_AT: ${{ vars.APP_PRIVACY_UPDATED_AT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Formatting and lint
        run: npm run format:check && npm run lint

      - name: Build Angular
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Test study rules
        run: npm run test:coverage

      - name: Start app for E2E
        run: |
          npm start -- --host 127.0.0.1 > /tmp/app-flash-card.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/app-flash-card.log
          exit 1

      - name: Cypress E2E
        run: npm run e2e

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/app-flash-card/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
